[package]
name = "deepchat-desktop"
version = "1.0.0"
description = "chat.deepseek.com 网页端桌面应用（Tauri 2）"
authors = ["deepchat-desktop contributors"]
edition = "2021"

# 静态库/动态库/普通库三种产物，供不同构建方式使用（Tauri 2 标准配置）
[lib]
name = "deepchat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
