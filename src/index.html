<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepChat Desktop</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        background: #f9f9f9;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f1010;
        }
      }
      .launch {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        color: #4d6bfe;
      }
      .launch .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(77, 107, 254, 0.2);
        border-top-color: #4d6bfe;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      .launch p {
        font-size: 14px;
        color: #888;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      // 主窗口实际加载的是 https://chat.deepseek.com，
      // 该页面仅作为本地前端资源占位（frontendDist），正常情况下不会展示。
      setTimeout(() => {
        location.replace("https://chat.deepseek.com");
      }, 0);
    </script>
  </head>
  <body>
    <div class="launch">
      <div class="spinner"></div>
      <p>正在启动 DeepChat…</p>
    </div>
  </body>
</html>
