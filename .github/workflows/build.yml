name: Build DeepChat Desktop

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args:

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.target }}-

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install npm dependencies
        run: npm install

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri build -- ${{ matrix.args }}
        shell: bash

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          NO_STRIP: "true"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepchat-desktop-${{ runner.os }}-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
            src-tauri/target/release/bundle/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find src-tauri/target -path "*/release/bundle/*" \
            \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" \
               -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) \
            -print0 | while IFS= read -r -d '' f; do
              echo "uploading: $f"
              gh release upload "${GITHUB_REF_NAME}" "$f" --clobber
          done